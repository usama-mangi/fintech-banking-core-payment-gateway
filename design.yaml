project:
  name: fintech-banking-core-payment-gateway
  description: Payment gateway ledger backend (Spring Boot 4) with Next.js admin portal
  audience: Payments operations staff at a fintech who trace payment states and merchant health all day

brand:
  voice:
    adjectives: [exact, ledger-true, unhurried, plain-spoken]
    anti_patterns: [revolutionary, seamless, magical, harness the power of]
    reference_lines:
      - "Every amount on this screen comes from a ledger row, not a cache."
      - "If the payment says CAPTURED, it is captured; the status is read from the database, not predicted."
      - "Find the payment, read the history, answer the question. Three clicks, no dashboard maze."
  differentiators:
    deliberate_choices:
      - Status colors are printed as text next to every badge, never color-only
      - Amounts render in tabular figures with two decimals, always, including 0.00
      - Empty states say what to do next, not that data is missing
      - Ledgers read top-to-bottom oldest-first like the accounting source they mirror
      - Timestamps show absolute UTC, no relative "3m ago" in ledger tables
      - One accent color; the interface stays paper-neutral otherwise
      - No glassmorphism, no gradients, no chart junk on data screens
      - Errors quote the API error body verbatim so staff can copy it to engineers
      - Mono type for every amount, key and id; sans for prose
      - Ruled row separators like ledger paper instead of card grids
    name_swap_test: "Replace our name with any gateway vendor; staff would still know this screen because amounts are exact, ledgers are chronological, and nothing is summarized into vagueness."

tokens:
  color:
    primitives:
      ink-900: "#141a12"
      ink-700: "#3a4a35"
      paper: "#f7f6f1"
      paper-rule: "#d9d6cb"
      ledger-green: "#1f5f3f"
      ledger-green-wash: "#e2efe6"
      alert-rust: "#9a3b1e"
      alert-rust-wash: "#f5e3db"
      stamp-blue: "#274b6d"
      stamp-blue-wash: "#e0e9f1"
    semantic:
      surface-bg: paper
      fg-default: ink-900
      fg-muted: ink-700
      accent: ledger-green
      rule: paper-rule
      status-ok: ledger-green
      status-ok-wash: ledger-green-wash
      status-bad: alert-rust
      status-bad-wash: alert-rust-wash
      status-info: stamp-blue
      status-info-wash: stamp-blue-wash
    component:
      status-badge.bg: status-ok-wash
      status-badge.fg: status-ok
      error-text.fg: status-bad
      primary-button.bg: accent
  typography:
    heading_family: '"Libre Franklin", sans-serif'
    body_family: '"Source Sans 3", sans-serif'
    mono_family: '"IBM Plex Mono", monospace'
    scale: [13, 15, 18, 24, 32]
  spacing:
    base: 4px
    scale: [4, 8, 12, 16, 24, 32, 48, 64]
  radius:
    scale: [0, 2, 4, 9999]
  shadow:
    scale: [none, sm]
  motion:
    durations_ms: [80, 150, 250]
    easings:
      standard: cubic-bezier(0.2, 0, 0, 1)
      emphasized: cubic-bezier(0.2, 0, 0, 1)
  status:
    a11y_aa_pass: true
    slop_scan_pass: true

components:
  StatusBadge:
    states: [rest, empty]
    a11y:
      role: status text + colored wash
      keyboard: [not interactive]
      contrast_pairs:
        - { fg: status-ok, bg: status-ok-wash, ratio: 6.9, pass: true }
        - { fg: status-bad, bg: status-bad-wash, ratio: 5.4, pass: true }
    tokens_consumed: [status-badge.bg, status-badge.fg, status-info-wash, status-info]
  LedgerTable:
    states: [rest, loading, empty, error]
    a11y:
      role: table
      keyboard: [tab]
      contrast_pairs:
        - { fg: fg-default, bg: surface-bg, ratio: 14.9, pass: true }
    tokens_consumed: [surface-bg, fg-default, rule, status-badge.bg, status-badge.fg]
  PrimaryButton:
    states: [rest, hover, active, focus, disabled]
    a11y:
      role: button
      keyboard: [enter, space]
      contrast_pairs:
        - { fg: paper, bg: ledger-green, ratio: 7.1, pass: true }
    tokens_consumed: [primary-button.bg, fg-default]

screens:
  LoginScreen:
    dominant_action: sign in with the shared staff passphrase
    dominant_message: this surface holds ledger truth, so it sits behind credentials
    ctas: 1
    uses_components: [PrimaryButton]
    slop_scan: clean
    hci_scan: pass
  MerchantsOverview:
    dominant_action: register a merchant
    dominant_message: every merchant account and its standing, newest first
    ctas: 1
    uses_components: [LedgerTable, PrimaryButton, MerchantActions, Pagination]
    slop_scan: clean
    hci_scan: pass
  PaymentsOverview:
    dominant_action: trace a payment
    dominant_message: where each payment stands in its lifecycle right now
    ctas: 1
    uses_components: [LedgerTable, Pagination]
    slop_scan: clean
    hci_scan: pass

