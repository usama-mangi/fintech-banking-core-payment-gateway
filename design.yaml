    - "TASK-11: merchants table gained a per-row lifecycle actions column (suspend/reactivate/close, contextual to status, close styled in the alert-rust family); token set unchanged."
    - "TASK-09: added the sign-in screen (standalone shell, no ledger chrome) and moved header/footer chrome into the authenticated staff layout; token set and motion unchanged."
    - "Initialized design system for the admin portal: field-notes/ledger direction, paper-ink-green token set, Libre Franklin + Source Sans 3 + IBM Plex Mono, productive motion."
    - "TASK-05: merchants, payments list and payment detail screens built on the token set; ledger-row reveal shipped as the L3 signature motion with reduced-motion opacity fallback; intent gates re-run after build, all pass."

intent:
  audience:
    identity: "Payments operations specialist at a growing fintech, mid-senior, spends the day answering merchant and payment state questions from support tickets"
    pains:
      - "I have to open three tools to answer one 'where is this payment' question"
      - "The amounts I see don't match what finance reconciled this morning"
      - "Status badges are just colors; I can't tell authorized from captured at a glance"
      - Every dashboard shows me charts but nobody shows me the actual ledger rows
    objections:
      - "Does this show live database state or a cached rollup?"
      - "Can I trace one payment's full history without exporting anything?"
      - "Will this slow down when we're at peak ticket volume?"
    say:
      - "that payment hasn't captured yet"
      - check the ledger
      - merchant is on hold
      - "what's the auth code"
      - reconcile the refunds
    never_say:
      - seamless omnichannel experience
      - unlock the power of real-time insights
    triggers:
      - a support ticket about a stuck payment
      - month-end reconciliation disagreement with finance
      - onboarding a new merchant and watching its first payments
    proof_formats:
      - exact amounts matching the database
      - chronological ledger rows with timestamps
      - verbatim API error text they can paste to engineers
    operator_vs_prosperer: "Operator: the ops specialist running queries all day; Prosperer: the merchant who gets a faster, accurate answer about their money"
  style:
    direction: "Field-notes ledger: a ruled-paper accounting book brought to a screen, where the interface inherits the credibility of double-entry records"
    rubric:
      field_notes_ledger: 24
      swiss_international: 21
      instrument_panel_cockpit: 19
      terminal_monospace_ops: 17
      editorial_print: 15
    rejected:
      - "Swiss: strongest grid rigor but its neutral voice undersells the chronological storytelling the ledger rows provide"
      - "Cockpit: dense-gauge feel fits engineering dashboards, wrong register for money questions from support staff"
      - "Terminal: mono-first authority but too hostile for eight-hour daily use by non-engineers"
      - "Editorial print: readable and warm but reads as a magazine, not a system of record"
  motion:
    personality: productive
    signature: "Ledger-row reveal: when a payment's history loads, rows stamp in sequentially 40ms apart with a tiny translateY settle, like entries being written into the book"
  delivery:
    gates_run: 2026-09-17
    results:
      audience: pass
      style: pass
      motion: pass
      delivery: pass
    exceptions:
      - "L3 signature motion shipped on ledger reveal only; internal data tool, reduced-motion collapses it to opacity swap"
      - "Launch assets (OG/meta beyond favicon) deferred: internal tool, no public marketing surface; cited from delivery-standard ops section"

