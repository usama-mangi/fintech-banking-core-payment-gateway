# Prod profile: PostgreSQL, all credentials from the environment. No secrets in git.
spring.datasource.url=${PAYMENTGW_DB_URL}
spring.datasource.username=${PAYMENTGW_DB_USER}
spring.datasource.password=${PAYMENTGW_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Validate by default; set PAYMENTGW_DDL_AUTO=update for the FIRST boot against
# an empty database so Hibernate creates the schema. Return it to validate
# (or unset the var) once the schema exists.
spring.jpa.hibernate.ddl-auto=${PAYMENTGW_DDL_AUTO:validate}

spring.jpa.show-sql=false

# Pool sized for MVP traffic (see docs/system-design.md capacity section).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
