# Prod profile: PostgreSQL, all credentials from the environment. No secrets in git.
spring.datasource.url=${PAYMENTGW_DB_URL}
spring.datasource.username=${PAYMENTGW_DB_USER}
spring.datasource.password=${PAYMENTGW_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

# Pool sized for MVP traffic (see docs/system-design.md capacity section).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
