# Application defaults shared by every profile.
spring.application.name=PaymentGateway

# The web layer must not keep a Hibernate session open for view rendering;
# the service layer owns all persistence boundaries.
spring.jpa.open-in-view=false

# Ops visibility: health endpoint for liveness probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# SQL logging is profile-specific (dev on, prod/test off).
spring.jpa.properties.hibernate.format_sql=false
